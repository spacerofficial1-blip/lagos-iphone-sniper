name: Lagos iPhone Sniper 24/7 Cloud Runner

on:
  schedule:
    # Runs automatically every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to trigger a run manually with 1 click on GitHub

jobs:
  snipe_deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Jiji.ng & Facebook Marketplace Lagos Sweep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python scraper_engine.py

      - name: Save Seen Ads & Updated Market Benchmarks
        run: |
          git config --global user.name "Lagos-iPhone-Sniper-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add market_config.json seen_listings.json || true
          git diff --staged --quiet || git commit -m "Auto-update seen deals and Jiji Lagos benchmarks"
          git push
